<!-- Botón para abrir el modal (colócalo donde quieras en tu página) -->
<button id="btn-open-login" class="bg-indigo-600 text-white px-4 py-2 rounded-md shadow hover:bg-indigo-500 transition font-semibold">
  Iniciar Sesión
</button>

<!-- Modal de Login -->
<div id="modal-login" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
  <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-8 relative">
    <button id="btn-close-login" class="absolute top-4 right-4 text-gray-600 hover:text-gray-900" aria-label="Cerrar modal">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Iniciar Sesión</h2>
    <form id="form-login" class="space-y-6">
      <div>
        <label for="username" class="block text-gray-700 font-semibold mb-1">Usuario</label>
        <input type="text" id="username" name="username" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label for="password" class="block text-gray-700 font-semibold mb-1">Contraseña</label>
        <input type="password" id="password" name="password" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-md font-semibold hover:bg-indigo-500 transition">Entrar</button>
    </form>
    <p id="error-msg" class="text-red-600 mt-4 text-center hidden">Usuario o contraseña incorrectos.</p>
  </div>
</div>

<!-- Script para controlar el modal y validación -->
<script>
  // Obtener elementos
  const btnOpenLogin = document.getElementById('btn-open-login');
  const modalLogin = document.getElementById('modal-login');
  const btnCloseLogin = document.getElementById('btn-close-login');
  const formLogin = document.getElementById('form-login');
  const errorMsg = document.getElementById('error-msg');

  // Abrir modal
  btnOpenLogin.addEventListener('click', () => {
    modalLogin.classList.remove('hidden');
  });

  // Cerrar modal
  btnCloseLogin.addEventListener('click', () => {
    modalLogin.classList.add('hidden');
    errorMsg.classList.add('hidden');
    formLogin.reset();
  });

  // Validación simple del formulario
  formLogin.addEventListener('submit', (e) => {
    e.preventDefault();
    const username = formLogin.username.value.trim();
    const password = formLogin.password.value.trim();

    // Usuario y contraseña fijos para demo
    if (username === 'usuario' && password === '1234') {
      // Redirigir a dashboard o página deseada
      window.location.href = 'dashboard.html';
    } else {
      errorMsg.classList.remove('hidden');
    }
  });

  // Opcional: cerrar modal al hacer clic fuera del contenido
  modalLogin.addEventListener('click', (e) => {
    if (e.target === modalLogin) {
      modalLogin.classList.add('hidden');
      errorMsg.classList.add('hidden');
      formLogin.reset();
    }
  });
